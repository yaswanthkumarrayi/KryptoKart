name: billing_fixed
description: "KryptoKart - Unified Fintech + POS System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_bloc: ^8.1.5
  get_it: ^7.6.7
  equatable: ^2.0.5
  bloc: ^8.1.4

  # Navigation
  go_router: ^14.0.0

  # HTTP & Networking
  dio: ^5.4.0
  connectivity_plus: ^6.0.3

  # UI & Styling
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_credit_card: ^4.0.1

  # Scanner
  mobile_scanner: ^5.1.0

  # Payments
  razorpay_flutter: ^1.3.7
  walletconnect_flutter_v2: ^2.3.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2

  # Utilities
  uuid: ^4.5.2
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5
  vibration: ^2.0.0
  image_picker: ^1.0.7
  local_auth: ^2.3.0
  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/crypto.json
    - assets/card.png
